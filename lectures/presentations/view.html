<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Teaching slides</title><link rel="stylesheet" href="viewer.css"></head><body>
<header class="controls"><a id="return" href="../index.html">Module</a><label>Show <select id="track"><option value="core">Resident teaching</option><option value="all">Complete deck</option><option value="advanced">Advanced teaching</option><option value="reference">Reference</option></select></label><label class="jump-label">Section <select id="jump" aria-label="Go to section"></select></label><button id="notes-toggle" aria-expanded="false">Notes</button><button id="fullscreen">Full screen</button><a id="download" download>Download PowerPoint</a></header>
<main id="stage"><div id="slide" role="region" aria-label="Presentation slide"><p id="loading">Loading presentation...</p></div></main><footer class="controls"><button id="previous" aria-label="Previous slide">Previous</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">Next</button><span class="hint">Arrow keys to advance. F for full screen. N for notes.</span></footer>
<aside id="notes" hidden><h2>Speaker notes and sources</h2><div id="notes-body"></div></aside><script src="viewer.js"></script></body></html>
